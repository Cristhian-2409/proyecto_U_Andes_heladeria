services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: heladeria
      POSTGRES_PASSWORD: heladeria
      POSTGRES_DB: heladeria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heladeria -d heladeria"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # PostgreSQL local ya usa el puerto 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-docker-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: heladeria
      POSTGRES_USER: heladeria
      POSTGRES_PASSWORD: heladeria
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
